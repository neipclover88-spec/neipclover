<style>

  .et-field-label{ display:block; font-size:11px; color:var(--text-2); margin-bottom:5px; font-weight:600; }
  .et-input{ width:100%; height:40px; border-radius:10px; border:1px solid var(--border); background:var(--surface-alt); padding:0 12px; font-size:13px; color:var(--text); }

<script>
/* ===========================================================
   Firebase 연동 — 연우한의 대시보드(neipclover88-3db3f)와 같은 프로젝트,
   단 별도 경로(bdh3_exercise)를 써서 기존 대시보드 데이터와 안 섞이게 함.
   ⚠ 메인 대시보드의 db[date].health.running 등과는 별개의 독립 데이터임 —
      두 페이지를 완전히 하나로 합치려면 나중에 스키마 통합 작업이 별도로 필요함.
=========================================================== */
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyC9QBrj_8YSvT1Nk7CsTPu_vKk-zetdmnU",
  authDomain:        "neipclover88-3db3f.firebaseapp.com",
  databaseURL:       "https://neipclover88-3db3f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "neipclover88-3db3f",
  storageBucket:     "neipclover88-3db3f.firebasestorage.app",
  messagingSenderId: "419747329488",
  appId:             "1:419747329488:web:a506aad1485222c548f5d5",
  measurementId:     "G-CGM0M6HLHS",
};
const FB_PATH = "bdh3_exercise"; // 운동관리탭 전용 경로 (메인 대시보드는 "bdh3")
const STORAGE_PATH_PREFIX = "exercise-screenshots";

let fbApp = null;
try {
  fbApp = firebase.initializeApp(FIREBASE_CONFIG);
} catch (e) {
  console.error("Firebase 초기화 실패", e);
}

/* ===========================================================
   데이터 계층 — Firebase Realtime Database
=========================================================== */
function loadData() {
  return new Promise((resolve) => {
    if (!fbApp) { resolve(exDefaultData()); return; }
    firebase.database().ref(FB_PATH).once("value")
      .then((snap) => {
        const val = snap.val();
        resolve(val || exDefaultData());
      })
      .catch((e) => {
        console.error("Firebase 불러오기 실패", e);
        resolve(exDefaultData());
      });
  });
}
function saveData(data) {
  if (!fbApp) return Promise.resolve();
  return firebase.database().ref(FB_PATH).set(data).catch((e) => {
    console.error("Firebase 저장 실패", e);
  });
}
function exDefaultData() {
  return {
    entries: [],
    shoes: [
      { id: uid(), name: "Nova Blast 5", targetKm: 600, retired: false },
      { id: uid(), name: "Gel Kayano 32", targetKm: 700, retired: false },
    ],
  };
}

// 리사이즈된 스크린샷(dataURL)을 Storage에 올리고 다운로드 URL을 반환
function uploadScreenshot(dataUrl) {
  if (!fbApp) return Promise.reject(new Error("firebase not initialized"));
  const path = `${STORAGE_PATH_PREFIX}/${Date.now()}_${uid()}.jpg`;
  return firebase.storage().ref(path).putString(dataUrl, "data_url")
    .then((snap) => snap.ref.getDownloadURL());
}

/* ===========================================================
   상수 / 유틸
=========================================================== */
const WEATHER_OPTIONS = [
  { key: "sunny", icon: "☀️", label: "맑음" },
  { key: "partly_cloudy", icon: "🌤️", label: "구름낀 맑음" },
  { key: "cloudy", icon: "☁️", label: "흐림" },
  { key: "rainy", icon: "🌧️", label: "비" },
  { key: "heavy_rain", icon: "⛈️", label: "강우" },
  { key: "snowy", icon: "❄️", label: "눈" },
  { key: "windy", icon: "💨", label: "바람" },
];
const TYPES = {
  running:  { label: "러닝",  icon: "🏃", v: "run" },
  swimming: { label: "수영",  icon: "🏊", v: "swim" },
  cycling:  { label: "자전거", icon: "🚴", v: "cycle" },
  gym:      { label: "헬스",  icon: "🏋", v: "gym" },
};
const TYPE_ORDER = ["running", "swimming", "cycling", "gym"];

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function round1(n) { return Math.round(n * 10) / 10; }
// 총 초 -> "1시간 20분 34초" 형태로 정규화해서 표시
function formatDurationLong(totalSec) {
  if (totalSec == null || isNaN(totalSec)) return "";
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return h > 0 ? `${h}시간 ${m}분 ${s}초` : `${m}분 ${s}초`;
}
// 캘린더 셀 등 짧은 표시용 ("1시간 20분" / "34분")
function formatDurationShort(totalSec) {
  if (totalSec == null || isNaN(totalSec)) return "";
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  return `${m}:${String(s).padStart(2, "0")}`;
}
// km당 초 -> "5'30""
function formatPace(secPerKm) {
  if (secPerKm == null || !isFinite(secPerKm) || secPerKm <= 0) return null;
  const m = Math.floor(secPerKm / 60);
  const s = Math.round(secPerKm % 60);
  return `${m}'${String(s).padStart(2, "0")}"`;
}
function fmtDate(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function todayStr() { return fmtDate(new Date()); }
function addDays(d, n) { const nd = new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function startOfWeek(d) {
  const nd = new Date(d);
  const offset = (nd.getDay() + 6) % 7; // 월요일=0 이 되도록 보정
  nd.setDate(nd.getDate() - offset);
  return nd;
}
function buildThreeWeekGrid(weekOffset) {
  weekOffset = weekOffset || 0;
  const gridStart = addDays(startOfWeek(new Date()), -14 - weekOffset * 21);
  const days = [];
  for (let i = 0; i < 21; i++) days.push(addDays(gridStart, i));
  return days;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function resizeImageToDataUrl(file, maxSide, quality) {
  maxSide = maxSide || 900; quality = quality || 0.8;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h && w > maxSide) { h = Math.round(h * maxSide / w); w = maxSide; }
        else if (h > maxSide) { w = Math.round(w * maxSide / h); h = maxSide; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ===========================================================
   전역 상태
=========================================================== */
let state = { entries: [], shoes: [] }; // Firestore 로드 완료 전 임시값
let loaded = false;
let filter = "all";
let selectedDate = null;   // 캘린더에서 선택된 날짜 - 우측 카드가 이 날짜 상세로 전환됨
let editingEntry = null;   // 수정 중인 기록 (null이면 신규 추가 모드)
let modalDate = null;
let modalMode = null; // 'typeSelect' | 'form' | 'shoeManager'
let modalSelectedType = null;
let pendingScreenshot = null;
let gymQuickList = []; // 헬스 폼에서 즉시 누적되는 종목 리스트
let calendarWeekOffset = 0; // 0=최근 3주, 1=그 이전 3주 ... 캘린더 뒤로가기

function persist() { saveData(state); }

/* ===========================================================
   파생 데이터
=========================================================== */
function entriesByDate() {
  const map = {};
  for (const e of state.entries) {
    (map[e.date] = map[e.date] || []).push(e);
  }
  return map;
}
function shoeMileage() {
  const map = {};
  for (const s of state.shoes) map[s.id] = s.initialKm || 0;
  for (const e of state.entries) {
    if (e.type === "running" && e.status === "confirmed" && e.shoeId && e.distance) {
      map[e.shoeId] = (map[e.shoeId] || 0) + Number(e.distance);
    }
  }
  return map;
}
// 신발별 가장 최근 착용일 (YYYY-MM-DD) - 안 신은 신발은 null
function shoeLastWorn() {
  const map = {};
  for (const e of state.entries) {
    if (e.type === "running" && e.status === "confirmed" && e.shoeId) {
      if (!map[e.shoeId] || e.date > map[e.shoeId]) map[e.shoeId] = e.date;
    }
  }
  return map;
}
// 날짜를 "n일 전" 형태로 변환
function daysAgoLabel(dateStr) {
  if (!dateStr) return "기록없음";
  const d = new Date(dateStr + "T00:00:00");
  const t = new Date(todayStr() + "T00:00:00");
  const diffDays = Math.round((t - d) / 86400000);
  if (diffDays === 0) return "오늘";
  if (diffDays === 1) return "1일 전";
  if (diffDays < 0) return "예정";
  return `${diffDays}일 전`;
}
// 신발별 러닝 통계 - 평균페이스, 총 횟수 (초기거리는 포함 안 됨, 실제 로그된 러닝만 집계)
function shoeRunStats(shoeId) {
  const runs = state.entries.filter((e) => e.type === "running" && e.status === "confirmed" && e.shoeId === shoeId && e.distance > 0 && e.durationSec > 0);
  const count = runs.length;
  let avgPaceSec = null;
  if (count > 0) {
    const totalSec = runs.reduce((sum, e) => sum + Number(e.durationSec), 0);
    const totalKm = runs.reduce((sum, e) => sum + Number(e.distance), 0);
    avgPaceSec = totalKm > 0 ? totalSec / totalKm : null;
  }
  return { count, avgPaceSec };
}
// 최근에 신은 신발일수록 목록 아래로 - 안 신었거나 오래 안 신은 신발이 위로 오게 정렬
function sortShoesByRotation(shoes) {
  const lastWorn = shoeLastWorn();
  const mileage = shoeMileage();
  const active = shoes.filter((s) => !s.retired);
  const retired = shoes.filter((s) => s.retired);
  const worn = active.filter((s) => (mileage[s.id] || 0) >= 1);
  const unworn = active.filter((s) => (mileage[s.id] || 0) < 1);
  worn.sort((a, b) => {
    const da = lastWorn[a.id] || "";
    const db = lastWorn[b.id] || "";
    if (da === db) return 0;
    return da < db ? -1 : 1;
  });
  // 활성 신발(로테이션 대상 → 미착용) 다음, 은퇴한 신발은 항상 맨 아래
  return [...worn, ...unworn, ...retired];
}
function weekSummary() {
  const weekStart = startOfWeek(new Date());
  const weekDates = new Set();
  for (let i = 0; i < 7; i++) weekDates.add(fmtDate(addDays(weekStart, i)));
  const counts = { running:0, swimming:0, cycling:0, gym:0 };
  let totalMin = 0, totalKm = 0;
  for (const e of state.entries) {
    if (weekDates.has(e.date) && e.status === "confirmed") {
      counts[e.type] = (counts[e.type] || 0) + 1;
      if (e.durationSec) totalMin += Math.round(Number(e.durationSec) / 60);
      if (e.distance && e.type !== "gym") totalKm += Number(e.distance);
    }
  }
  return { counts, totalMin, totalKm };
}
function monthSummary() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const counts = { running: 0, swimming: 0, cycling: 0, gym: 0 };
  let totalMin = 0, totalKm = 0;
  for (const e of state.entries) {
    const ed = new Date(e.date + "T00:00:00");
    if (ed.getFullYear() === y && ed.getMonth() === m && e.status === "confirmed") {
      counts[e.type] = (counts[e.type] || 0) + 1;
      if (e.durationSec) totalMin += Math.round(Number(e.durationSec) / 60);
      if (e.distance && e.type !== "gym") totalKm += Number(e.distance);
    }
  }
  return { counts, totalMin, totalKm };
}
function recentRuns() {
  return state.entries
    .filter((e) => e.type === "running" && e.status === "confirmed")
    .sort((a, b) => (a.date < b.date ? 1 : -1))
    .slice(0, 5);
}
// 종목별 최고기록(페이스/속도) + 최장 저심박 기록(시간÷평균심박 비율 최대)
function computeRecords(type) {
  let best = null; // {value, date, entry}
  let bestEff = null; // 저심박 지속 - {durationSec, hr, date}
  let bestVo2max = null; // {value, date}
  let bestSwolf = null; // {value, date} - 낮을수록 좋음
  let bestDistance = null; // {value, date}

  for (const e of state.entries) {
    if (e.type !== type || e.status !== "confirmed") continue;

    if (type === "running" && e.distance > 0 && e.durationSec > 0) {
      const paceSec = e.durationSec / e.distance;
      if (!best || paceSec < best.value) best = { value: paceSec, date: e.date, label: formatPace(paceSec) + "/km" };
    } else if (type === "swimming" && e.distance > 0 && e.durationSec > 0) {
      const paceSec = e.durationSec / (e.distance * 10); // sec per 100m
      if (!best || paceSec < best.value) best = { value: paceSec, date: e.date, label: formatPace(paceSec) + "/100m" };
    } else if (type === "cycling" && e.distance > 0 && e.durationSec > 0) {
      const speed = e.distance / (e.durationSec / 3600);
      if (!best || speed > best.value) best = { value: speed, date: e.date, label: `${round1(speed)}km/h` };
    }

    if ((type === "running" || type === "swimming") && e.durationSec > 0 && e.avgHeartRate > 0) {
      const ratio = e.durationSec / e.avgHeartRate;
      if (!bestEff || ratio > bestEff.ratio) {
        bestEff = { ratio, durationSec: e.durationSec, hr: e.avgHeartRate, date: e.date };
      }
    }

    if ((type === "running" || type === "cycling") && e.vo2max != null) {
      if (!bestVo2max || e.vo2max > bestVo2max.value) bestVo2max = { value: e.vo2max, date: e.date };
    }

    if (type === "swimming" && e.avgSwolf != null) {
      if (!bestSwolf || e.avgSwolf < bestSwolf.value) bestSwolf = { value: e.avgSwolf, date: e.date };
    }

    if (type === "cycling" && e.distance > 0) {
      if (!bestDistance || e.distance > bestDistance.value) bestDistance = { value: e.distance, date: e.date };
    }
  }
  return { best, bestEff, bestVo2max, bestSwolf, bestDistance };
}
// 특정 필드의 추이 데이터 (날짜순, 값이 있는 것만) - 최근 N개
function collectTrendSeries(type, field, limit) {
  return state.entries
    .filter((e) => e.type === type && e.status === "confirmed" && e[field] != null)
    .sort((a, b) => (a.date < b.date ? -1 : 1))
    .slice(-(limit || 12));
}
// 거리+시간으로 계산한 페이스(초/km 또는 초/100m) 추이 - _paceSec 필드를 얹어서 반환
function collectPaceTrendSeries(type, limit) {
  const entries = state.entries
    .filter((e) => e.type === type && e.status === "confirmed" && e.distance > 0 && e.durationSec > 0)
    .sort((a, b) => (a.date < b.date ? -1 : 1))
    .slice(-(limit || 12));
  return entries.map((e) => ({
    ...e,
    _paceSec: type === "swimming" ? e.durationSec / (e.distance * 10) : e.durationSec / e.distance,
  }));
}
// entries[field] 값들로 미니 추이 SVG 라인차트 생성. higherIsBetter로 베스트 지점 강조
function buildTrendSVG(entries, field, color, higherIsBetter, formatValue) {
  if (!entries.length) return null;
  const fmt = formatValue || ((v) => v);
  const W = 280, H = 104, padTop = 18, padBottom = 18, padX = 8;
  const values = entries.map((e) => Number(e[field]));
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const plotH = H - padTop - padBottom;
  const n = entries.length;
  const xStep = n > 1 ? (W - padX * 2) / (n - 1) : 0;
  const coords = entries.map((e, i) => {
    const x = padX + i * xStep;
    const norm = (Number(e[field]) - min) / range;
    const y = padTop + plotH * (1 - norm);
    return { x, y, val: Number(e[field]), date: e.date };
  });
  let bestIdx = 0;
  for (let i = 1; i < coords.length; i++) {
    if (higherIsBetter ? coords[i].val > coords[bestIdx].val : coords[i].val < coords[bestIdx].val) bestIdx = i;
  }
  const linePts = coords.map((c) => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
  const areaPts = `${padX},${H - padBottom} ${linePts} ${coords[coords.length - 1].x.toFixed(1)},${H - padBottom}`;
  const circles = coords.map((c, i) => {
    const isBest = i === bestIdx;
    return `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${isBest ? 4.5 : 2.5}" fill="${color}" opacity="${isBest ? 1 : 0.55}"${isBest ? ` style="filter:drop-shadow(0 0 5px ${color})"` : ""}/>`;
  }).join("");
  // 점 위/아래가 겹치지 않게 값 위치가 위쪽 가장자리면 아래로, 아니면 위로 라벨 배치
  const valueLabels = coords.map((c) => {
    const above = c.y > padTop + 8;
    const ly = above ? c.y - 7 : c.y + 12;
    return `<text x="${c.x.toFixed(1)}" y="${ly.toFixed(1)}" font-size="7" fill="${color}" text-anchor="middle" font-family="Pretendard,sans-serif">${escapeHtml(String(fmt(c.val)))}</text>`;
  }).join("");
  const firstLabel = entries[0].date.slice(5);
  const lastLabel = entries[entries.length - 1].date.slice(5);
  return `
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
    <polygon points="${areaPts}" fill="${color}" opacity="0.08"></polygon>
    <polyline points="${linePts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>
    ${circles}
    ${valueLabels}
    <text x="${padX}" y="${H - 4}" font-size="8" fill="var(--text-3)" font-family="Pretendard,sans-serif">${firstLabel}</text>
    <text x="${W - padX}" y="${H - 4}" font-size="8" fill="var(--text-3)" font-family="Pretendard,sans-serif" text-anchor="end">${lastLabel}</text>
  </svg>`;
}
function draftCount() {
  return state.entries.filter((e) => e.status === "draft").length;
}

function render() {
  const root = document.getElementById("et-root");
  if (!loaded) {
    root.innerHTML = `<div style="padding:3rem;text-align:center;color:var(--text-3);font-size:14px;">불러오는 중…</div>`;

  }
  root.innerHTML = `

}

function renderHeader() {
  const dc = draftCount();
  const pills = ["all", ...TYPE_ORDER].map((t) => {
    const active = filter === t;
    const label = t === "all" ? "전체" : TYPES[t].label;
    const v = t === "all" ? null : TYPES[t].v;
    const glowColor = v==="run"?"39,201,110":v==="swim"?"79,142,247":v==="cycle"?"245,166,35":v==="gym"?"231,76,60":"39,201,110";
    const style = active
      ? `border-color:var(--${v||"run"});background:var(--${v?v+"-bg":"surface-alt"});color:var(--${v?v+"-tx":"text"});box-shadow:0 0 10px rgba(${glowColor},.35);`
      : "";
    return `<button class="et-pill et-btn ${active?"active":""}" style="${style}" data-filter="${t}">${label}</button>`;
  }).join("");

  return `
  <div id="et-header">
    <div style="display:flex;align-items:baseline;gap:10px;">
      <span style="display:inline-block;width:6px;height:20px;border-radius:3px;background:var(--run);transform:translateY(3px);box-shadow:0 0 10px rgba(39,201,110,.7);"></span>
      <span style="font-size:22px;font-weight:800;letter-spacing:-0.02em;">운동 관리</span>
      ${dc > 0 ? `<span style="font-size:11px;padding:3px 9px;border-radius:999px;background:var(--cycle-bg);color:var(--cycle-tx);font-weight:600;">미확인 ${dc}</span>` : ""}
    </div>

    </div>
  </div>`;
}

function renderCalendar() {
  const days = buildThreeWeekGrid(calendarWeekOffset);
  const today = todayStr();
  const byDate = entriesByDate();
  const weekday = ["월","화","수","목","금","토","일"];

  const first = days[0], last = days[days.length - 1];
  const monthLabel = first.getMonth() === last.getMonth()
    ? `${first.getFullYear()}년 ${first.getMonth() + 1}월`
    : `${first.getMonth() + 1}월 ${first.getDate()}일 – ${last.getMonth() + 1}월 ${last.getDate()}일`;

  const weekdayRow = weekday.map((w) => {
    const color = w === "토" ? "var(--swim)" : w === "일" ? "var(--gym)" : "var(--text-3)";
    return `<span class="et-weekday" style="color:${color};">${w}</span>`;
  }).join("");
  const cells = days.map((d) => {
    const dateStr = fmtDate(d);
    const dayEntries = (byDate[dateStr] || []).filter((e) => filter === "all" || e.type === filter);
    return renderDayCell(d, dateStr, dayEntries, dateStr === today, dateStr > today);
  }).join("");

  return `
  <div class="et-card" style="padding:16px 16px 14px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <button id="et-cal-prev" class="et-btn" style="background:var(--surface-alt);border:none;width:24px;height:24px;border-radius:50%;font-size:12px;color:var(--text-2);display:flex;align-items:center;justify-content:center;">‹</button>
        <span style="font-size:15px;font-weight:700;letter-spacing:-0.01em;">${monthLabel}</span>
        <button id="et-cal-next" class="et-btn" style="background:var(--surface-alt);border:none;width:24px;height:24px;border-radius:50%;font-size:12px;color:${calendarWeekOffset > 0 ? "var(--text-2)" : "var(--text-3)"};display:flex;align-items:center;justify-content:center;opacity:${calendarWeekOffset > 0 ? 1 : 0.4};" ${calendarWeekOffset > 0 ? "" : "disabled"}>›</button>
      </div>
      <span style="font-size:11px;color:var(--text-3);font-weight:500;">${calendarWeekOffset === 0 ? "최근 3주" : "3주 전"}</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px;">${weekdayRow}</div>
    <div id="et-calendar-grid">${cells}</div>
  </div>`;
}

function renderDayCell(date, dateStr, entries, isToday, isFuture) {
  const hasDraft = entries.some((e) => e.status === "draft");
  const isSelected = dateStr === selectedDate;
  let bg = "var(--surface-alt)";
  let border = isToday ? "1px solid transparent" : hasDraft ? "1.5px dashed var(--border-strong)" : "1px solid transparent";
  let inner = "";

  if (entries.length === 1) {
    const e = entries[0];
    const meta = TYPES[e.type];
    bg = `var(--${meta.v}-bg)`;
    const stat = e.type === "gym" ? ((e.bodyParts && e.bodyParts.length) ? gymBroadCategories(e.bodyParts).join("·") : "") : (e.distance ? `${round1(e.distance)}km` : (e.durationSec ? formatDurationShort(e.durationSec) : ""));
    const isNumericStat = e.type !== "gym";
    inner = `<div style="display:flex;align-items:center;gap:4px;line-height:1;">
      <span style="font-size:15px;">${meta.icon}</span>
      ${stat ? `<span class="${isNumericStat?`et-num et-glow-${meta.v}`:""}" style="font-size:${isNumericStat?13:10.5}px;font-weight:${isNumericStat?400:600};color:var(--${meta.v}-tx);">${escapeHtml(stat)}</span>` : ""}
    </div>`;
  } else if (entries.length > 1) {
    const dots = entries.slice(0,4).map((e) => `<span style="width:6px;height:6px;border-radius:50%;background:var(--${TYPES[e.type].v});display:inline-block;"></span>`).join("");
    inner = `<div style="display:flex;gap:4px;">${dots}</div>`;
  }

  const opacity = (isFuture && entries.length === 0) ? "opacity:0.45;" : "";
  const todayGlow = isToday ? "box-shadow:0 0 0 1.5px var(--run), 0 0 12px rgba(39,201,110,.45);" : "";
  const shadow = isSelected ? "box-shadow:0 0 0 2px var(--text);" : todayGlow;

  const weatherEntry = entries.find((e) => e.weather || e.temperature != null);
  const weatherBadge = weatherEntry ? `
    <span style="position:absolute;top:3px;right:4px;font-size:7px;color:var(--text-3);display:flex;align-items:center;gap:1px;line-height:1;">
      ${weatherEntry.weather ? (WEATHER_OPTIONS.find((w) => w.key === weatherEntry.weather)?.icon || "") : ""}${weatherEntry.temperature != null ? `${Math.round(weatherEntry.temperature)}°` : ""}
    </span>` : "";

  return `
  <button class="et-daycell et-day et-btn" data-date="${dateStr}" style="position:relative;background:${entries.length>0?bg:"var(--surface-alt)"};border:${border};${opacity}${shadow}">
    ${weatherBadge}
    <span class="et-num" style="font-size:14px;font-weight:400;color:${isToday?"var(--run)":"var(--text-2)"};line-height:1;${isToday?"text-shadow:0 0 10px rgba(39,201,110,.6);":""}">${date.getDate()}</span>
    ${inner}
  </button>`;
}

  const mileage = shoeMileage();
  const body = active.length === 0
    ? `<div style="font-size:12px;color:var(--text-3);">등록된 신발이 없어요.</div>`
    : `<div style="display:flex;flex-direction:column;gap:2px;">${active.map((s) => {
        const km = mileage[s.id] || 0;
        const pct = Math.min(100, Math.round(km / s.targetKm * 100));
        const danger = pct >= 90;
        return `
        <div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;line-height:1.3;">
            <span style="font-size:12px;font-weight:500;white-space:nowrap;">${escapeHtml(s.name)}</span>
            ${s.role ? `<span style="font-size:10px;color:var(--text-3);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(s.role)}</span>` : ""}
          </div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:2px;">
            <div style="flex:1;height:5px;background:var(--surface-alt);border-radius:3px;overflow:hidden;">
              <div class="et-bar-fill" style="height:100%;width:${pct}%;background:${danger?"var(--danger)":"var(--run)"};border-radius:3px;box-shadow:0 0 8px ${danger?"rgba(231,76,60,.7)":"rgba(39,201,110,.7)"};"></div>
            </div>
            <span class="et-num" style="font-size:11px;font-weight:400;line-height:1;color:${danger?"var(--danger)":"var(--text-2)"};white-space:nowrap;">${round1(km)}/${s.targetKm}</span>
          </div>
        </div>`;
      }).join("")}</div>`;
  return `
  <div class="et-card" style="padding:16px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <span class="et-card-title" style="margin-bottom:0;">러닝화 마일리지</span>
      <button id="et-manage-shoes-btn2" class="et-btn" style="font-size:11px;color:var(--run);background:none;border:none;font-weight:600;">관리</button>
    </div>
    ${body}
  </div>`;
}

function entryDetailView(e) {
  const shoe = e.shoeId ? state.shoes.find((s) => s.id === e.shoeId) : null;
  const primary = [];
  const chips = [];
  const extraLines = [];
  const missing = [];
  let shoeInfo = null;
  let strokeChips = null;

  if (e.type === "running") {
    primary.push(["거리", e.distance != null ? `${round1(e.distance)}` : "-", "km"]);
    primary.push(["시간", e.durationSec != null ? formatDurationShort(e.durationSec) : "-", ""]);
    primary.push(["페이스", e.pace ? e.pace : "-", "/km"]);
    if (e.avgHeartRate != null) chips.push(["ti-heart", `${e.avgHeartRate}`, "bpm", "gym"]); else missing.push("평균심박수");
    if (e.avgCadence != null) chips.push(["ti-activity", `${e.avgCadence}`, "spm", "run"]); else missing.push("케이던스");
    if (e.vo2max != null) chips.push(["ti-lungs", `${e.vo2max}`, "VO2max", "swim"]); else missing.push("VO2max");
    if (e.elevationGain != null) chips.push(["ti-mountain", `${e.elevationGain}`, "m", null]); else missing.push("상승고도");
    if (e.climbDistance != null) chips.push(["ti-trending-up", `${e.climbDistance}`, "km", null]); else missing.push("총 오르막");
    if (e.calories != null) chips.push(["ti-flame", `${e.calories}`, "kcal", null]); else missing.push("칼로리");
    if (e.temperature != null) chips.push(["ti-temperature", `${e.temperature}`, "°C", null]); else missing.push("기온");
    if (e.humidity != null) chips.push(["ti-droplet", `${e.humidity}`, "%", null]); else missing.push("습도");
    if (e.weather) extraLines.push(`${WEATHER_OPTIONS.find((w) => w.key === e.weather)?.icon || ""} ${WEATHER_OPTIONS.find((w) => w.key === e.weather)?.label || e.weather}`);
    if (shoe) shoeInfo = shoe; else missing.push("러닝화");
  } else if (e.type === "cycling") {
    primary.push(["거리", e.distance != null ? `${round1(e.distance)}` : "-", "km"]);
    primary.push(["시간", e.durationSec != null ? formatDurationShort(e.durationSec) : "-", ""]);
    primary.push(["평균속도", e.avgSpeed != null ? `${e.avgSpeed}` : "-", "km/h"]);
    if (e.avgHeartRate != null) chips.push(["ti-heart", `${e.avgHeartRate}`, "bpm", "gym"]); else missing.push("평균심박수");
    if (e.avgCadence != null) chips.push(["ti-activity", `${e.avgCadence}`, "rpm", "run"]); else missing.push("케이던스");
    if (e.vo2max != null) chips.push(["ti-lungs", `${e.vo2max}`, "VO2max", "swim"]); else missing.push("VO2max");
    if (e.elevationGain != null) chips.push(["ti-mountain", `${e.elevationGain}`, "m", null]); else missing.push("상승고도");
    if (e.climbDistance != null) chips.push(["ti-trending-up", `${e.climbDistance}`, "km", null]); else missing.push("총 오르막");
    if (e.calories != null) chips.push(["ti-flame", `${e.calories}`, "kcal", null]); else missing.push("칼로리");
    if (e.temperature != null) chips.push(["ti-temperature", `${e.temperature}`, "°C", null]); else missing.push("기온");
    if (e.humidity != null) chips.push(["ti-droplet", `${e.humidity}`, "%", null]); else missing.push("습도");
    if (e.weather) extraLines.push(`${WEATHER_OPTIONS.find((w) => w.key === e.weather)?.icon || ""} ${WEATHER_OPTIONS.find((w) => w.key === e.weather)?.label || e.weather}`);
  } else if (e.type === "swimming") {
    primary.push(["총거리", e.distance != null ? `${Math.round(e.distance * 1000)}` : "-", "m"]);
    primary.push(["시간", e.durationSec != null ? formatDurationShort(e.durationSec) : "-", ""]);
    const distM = e.distance != null ? Math.round(e.distance * 1000) : 0;
    const calcPace = (distM > 0 && e.durationSec > 0) ? formatPace(e.durationSec / (distM / 100)) : null;
    const swimPace = e.swimPaceOverride || calcPace;
    primary.push(["평균 페이스", swimPace || "-", "/100m"]);
    if (e.avgHeartRate != null) chips.push(["ti-heart", `${e.avgHeartRate}`, "bpm", "gym"]); else missing.push("평균심박수");
    if (e.avgSwolf != null) chips.push(["ti-wave-sine", `${e.avgSwolf}`, "SWOLF", "cycle"]); else missing.push("SWOLF");
    if (e.calories != null) chips.push(["ti-flame", `${e.calories}`, "kcal", null]); else missing.push("칼로리");
    if (e.strokeDistances && Object.keys(e.strokeDistances).length) {
      strokeChips = SWIM_STROKES
        .filter((s) => Number(e.strokeDistances[s.key]) > 0)
        .map((s) => ({ label: s.label, meters: e.strokeDistances[s.key], key: s.key }));
    } else {
      missing.push("영법별 거리");
    }
  } else {
    // gym
    if (e.bodyParts && e.bodyParts.length) primary.push(["부위", e.bodyParts.join(", "), ""]); else missing.push("부위");
    if (e.calories != null) chips.push(["ti-flame", `${e.calories}`, "kcal", null]); else missing.push("칼로리");
    if (e.exercises && e.exercises.length) {
      e.exercises.forEach((x) => extraLines.push(`${x.name} · ${x.reps}회 × ${x.sets}세트`));
    } else {
      missing.push("세부 종목");
    }
  }

  return { primary, chips, extraLines, missing, shoeInfo, strokeChips };
}

function renderSelectedDayCard() {
  const dateEntries = (entriesByDate()[selectedDate] || []);
  const d = new Date(selectedDate + "T00:00:00");
  const label = `${d.getMonth() + 1}월 ${d.getDate()}일`;

    const meta = TYPES[e.type];
    const isDraft = e.status === "draft";
    const { primary, chips, extraLines, missing, shoeInfo, strokeChips } = entryDetailView(e);

    const primaryHtml = primary.length ? `

          </div>`).join("")}
      </div>` : "";

    const coloredChips = chips.filter(([,,,role]) => role);
    const neutralChips = chips.filter(([,,,role]) => !role);

    const chipsHtml = coloredChips.length ? `
      <div style="display:flex;flex-wrap:wrap;gap:6px;${shoeInfo||neutralChips.length||extraLines.length?"margin-bottom:6px;":""}">
        ${coloredChips.map(([icon, v, u, role]) => `
          <span style="display:inline-flex;align-items:center;gap:4px;background:var(--${role}-bg);border-radius:999px;padding:4px 9px 4px 10px;">
            <i class="ti ${icon}" style="font-size:12px;color:var(--${role});" aria-hidden="true"></i><span class="et-num et-glow-${role}" style="font-size:13px;color:var(--${role}-tx);">${escapeHtml(v)}</span><span style="color:var(--${role}-tx);font-size:9px;font-weight:600;opacity:0.8;">${u}</span>
          </span>`).join("")}

    const strokeChipsHtml = strokeChips && strokeChips.length ? `
      <div style="display:flex;flex-wrap:wrap;gap:6px;${shoeInfo||neutralChips.length||extraLines.length?"margin-bottom:6px;":""}">
        ${strokeChips.map((s) => {
          const c = STROKE_COLORS[s.key] || { color: "var(--swim)", bg: "var(--swim-bg)" };
          return `
          <span style="display:inline-flex;align-items:baseline;gap:4px;background:${c.bg};border:1px solid ${c.color};border-radius:10px;padding:5px 10px;">
            <span style="font-size:10.5px;font-weight:700;color:${c.color};">${escapeHtml(s.label)}</span>
            <span class="et-num" style="font-size:14px;color:${c.color};text-shadow:0 0 10px ${c.color}88;">${s.meters}<span style="font-family:'Pretendard',sans-serif;font-size:8px;font-weight:600;color:${c.color};opacity:0.85;">m</span></span>
          </span>`;
        }).join("")}
      </div>` : "";

    let shoeRowHtml = "";
    if (shoeInfo) {
      const km = mileageMap[shoeInfo.id] || 0;
      const pct = Math.min(100, Math.round((km / shoeInfo.targetKm) * 100));
      const danger = pct >= 90;
      shoeRowHtml = `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:${neutralChips.length||extraLines.length?8:0}px;">
        <span style="display:inline-flex;align-items:center;gap:5px;flex-shrink:0;">
          <i class="ti ti-shoe" style="font-size:14px;color:var(--${meta.v}-tx);" aria-hidden="true"></i>
          <span style="font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;">${escapeHtml(shoeInfo.name)}</span>
        </span>
        <div style="flex:1;display:flex;align-items:center;gap:6px;min-width:0;">
          <div style="flex:1;height:6px;background:var(--surface);border-radius:3px;overflow:hidden;">
            <div class="et-bar-fill" style="height:100%;width:${pct}%;background:${danger?"var(--danger)":"var(--run)"};border-radius:3px;box-shadow:0 0 8px ${danger?"rgba(231,76,60,.7)":"rgba(39,201,110,.7)"};"></div>
          </div>

function bindTopLevelEvents() {
  document.querySelectorAll(".et-pill").forEach((btn) => {
    btn.addEventListener("click", () => { filter = btn.dataset.filter; render(); });
  });

  const calPrev = document.getElementById("et-cal-prev");
  if (calPrev) calPrev.addEventListener("click", () => { calendarWeekOffset += 1; render(); });
  const calNext = document.getElementById("et-cal-next");
  if (calNext) calNext.addEventListener("click", () => { if (calendarWeekOffset > 0) { calendarWeekOffset -= 1; render(); } });

  document.querySelectorAll(".et-daycell").forEach((btn) => {
    btn.addEventListener("click", () => {
      const d = btn.dataset.date;
      selectedDate = (selectedDate === d) ? null : d; // 같은 날짜 다시 누르면 해제
      render();
    });
  });

  const shoeBtn1 = document.getElementById("et-manage-shoes-btn");
  const shoeBtn2 = document.getElementById("et-manage-shoes-btn2");
  [shoeBtn1, shoeBtn2].forEach((b) => b && b.addEventListener("click", () => { modalMode = "shoeManager"; render(); }));

  const deselectBtn = document.getElementById("et-deselect-day");
  if (deselectBtn) deselectBtn.addEventListener("click", () => { selectedDate = null; render(); });

  const addBtn = document.getElementById("et-day-add");
  if (addBtn) addBtn.addEventListener("click", () => {
    editingEntry = null;
    modalDate = selectedDate;
    modalMode = "typeSelect";
    modalSelectedType = null;
    pendingScreenshot = null;
    render();
  });

  document.querySelectorAll(".et-day-edit").forEach((btn) => {
    btn.addEventListener("click", () => {
      const entry = state.entries.find((e) => e.id === btn.dataset.id);
      if (!entry) return;
      editingEntry = entry;
      modalDate = entry.date;
      modalSelectedType = entry.type;
      pendingScreenshot = entry.screenshot || null;
      if (entry.type === "gym") gymQuickList = entry.exercises ? entry.exercises.map((x) => ({ ...x })) : [];
      modalMode = "form";
      render();
    });
  });

  document.querySelectorAll(".et-day-delete").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.entries = state.entries.filter((e) => e.id !== btn.dataset.id);
      persist();
      render();
    });
  });

  document.querySelectorAll(".et-day-screenshot").forEach((img) => {
    img.addEventListener("click", () => {
      const entry = state.entries.find((e) => e.id === img.dataset.id);
      if (!entry || !entry.screenshot) return;
      const w = window.open("", "_blank");
      if (w) w.document.write(`<title>스크린샷</title><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;"><img src="${entry.screenshot}" style="max-width:100%;max-height:100vh;"></body>`);
    });
  });
}

function renderModal() {
  let overlay = document.getElementById("et-modal-overlay");
  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "et-modal-overlay";
    overlay.innerHTML = `<div id="et-modal-box"></div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  }

  if (!modalMode) { overlay.classList.remove("open"); return; }
  overlay.classList.add("open");
  const box = document.getElementById("et-modal-box");

  if (modalMode === "shoeManager") { box.innerHTML = shoeManagerHtml(); bindShoeManagerEvents(); return; }
  if (modalMode === "typeSelect") { box.innerHTML = typeSelectHtml(); bindTypeSelectEvents(); return; }
  if (modalMode === "form") { box.innerHTML = typeFormHtml(); bindTypeFormEvents(); return; }
}

function closeModal() {
  modalDate = null; modalMode = null; modalSelectedType = null; pendingScreenshot = null; editingEntry = null;
  render();
}

}

const GYM_BODY_PART_GROUPS = [
  { group: "가슴", parts: ["흉근 상부", "흉근 중부", "흉근 하부"] },
  { group: "등", parts: ["광배근", "승모근", "척추기립근"] },
  { group: "어깨", parts: ["삼각근 전면", "삼각근 측면", "삼각근 후면"] },
  { group: "팔", parts: ["이두근", "삼두근", "전완근"] },
  { group: "하체", parts: ["대퇴사두근", "햄스트링", "둔근", "종아리"] },
  { group: "코어", parts: ["복근"] },
];
const GYM_BODY_PARTS = GYM_BODY_PART_GROUPS.flatMap((g) => g.parts);
// 세부 부위(예: "흉근 중부")를 대분류(예: "가슴")로 변환 - 캘린더처럼 좁은 공간에 표시할 때 사용
function gymBroadCategories(bodyParts) {
  if (!bodyParts || !bodyParts.length) return [];
  const cats = [];
  bodyParts.forEach((p) => {
    const g = GYM_BODY_PART_GROUPS.find((grp) => grp.parts.includes(p));
    const cat = g ? g.group : p;
    if (!cats.includes(cat)) cats.push(cat);
  });
  return cats;
}

// OCR 백엔드 엔드포인트 (아직 없음) — Firebase Cloud Function 등으로 만든 뒤 이 경로만 바꿔주면 됨.
// 프론트에서 Anthropic API를 직접 호출하면 API 키가 노출되므로, 반드시 서버를 거쳐야 함.
const OCR_ENDPOINT = "/api/ocr-running";

function bindTypeFormEvents() {
  bindModalClose();
  const t = modalSelectedType;

  document.getElementById("f-cancel").addEventListener("click", () => {
    if (editingEntry) { closeModal(); }
    else { modalMode = "typeSelect"; renderModal(); }
  });

  document.querySelectorAll(".et-weather-chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      const already = chip.dataset.selected === "1";
      document.querySelectorAll(".et-weather-chip").forEach((c) => {
        c.dataset.selected = "0";
        c.style.background = "var(--surface-alt)";
        c.style.color = "var(--text-2)";
        c.style.borderColor = "var(--border)";
        c.style.fontWeight = "500";
      });
      if (!already) {
        chip.dataset.selected = "1";
        chip.style.background = "var(--swim-bg)";
        chip.style.color = "var(--swim-tx)";
        chip.style.borderColor = "var(--swim)";
        chip.style.fontWeight = "600";
      }
    });
  });

  if (t === "gym") {
    function getSelectedBodyParts() {
      return Array.from(document.querySelectorAll('.et-bodypart-chip[data-selected="1"]')).map((c) => c.dataset.part);
    }
    function getFilteredPresetGroups() {
      const selectedParts = getSelectedBodyParts();
      if (selectedParts.length === 0) return EXERCISE_PRESETS; // 아직 부위 안 골랐으면 전체 목록
      return EXERCISE_PRESETS.filter((g) => selectedParts.includes(g.group));
    }
    function buildExerciseSelectOptions() {
      const groups = getFilteredPresetGroups();
      const optgroups = groups.map((g) => {
        const opts = g.exercises.map((ex) => `<option value="${escapeHtml(ex)}">${escapeHtml(ex)}</option>`).join("");
        return `<optgroup label="${g.group}">${opts}</optgroup>`;
      }).join("");
      return optgroups + `<option value="__custom__">✏️ 직접입력</option>`;
    }
    function refreshQuickSelect() {
      const selectEl = document.getElementById("f-gym-quick-select");
      if (!selectEl) return;
      const placeholder = getSelectedBodyParts().length === 0 ? "부위를 먼저 골라주세요" : "종목 선택";
      selectEl.innerHTML = `<option value="">${placeholder}</option>${buildExerciseSelectOptions()}`;
    }

    document.querySelectorAll(".et-bodypart-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        const active = chip.dataset.selected === "1";
        chip.dataset.selected = active ? "0" : "1";
        chip.style.background = active ? "var(--surface-alt)" : "var(--gym-bg)";
        chip.style.color = active ? "var(--text-2)" : "var(--gym-tx)";
        chip.style.borderColor = active ? "var(--border)" : "var(--gym)";
        chip.style.fontWeight = active ? "500" : "600";
        refreshQuickSelect();
      });
    });
    refreshQuickSelect();

    const quickSelect = document.getElementById("f-gym-quick-select");
    const quickCustom = document.getElementById("f-gym-quick-custom");
    quickSelect.addEventListener("change", () => {
      quickCustom.style.display = quickSelect.value === "__custom__" ? "block" : "none";
      if (quickSelect.value === "__custom__") quickCustom.focus();
    });

    function renderGymList() {
      const listEl = document.getElementById("f-gym-list");
      if (!listEl) return;
      if (gymQuickList.length === 0) {
        listEl.innerHTML = `<div style="font-size:11px;color:var(--text-3);">아직 추가한 종목이 없어요.</div>`;
        return;
      }
      listEl.innerHTML = gymQuickList.map((ex, i) => `
        <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--surface-alt);">
          <span style="font-size:12px;font-weight:600;flex:1;">${escapeHtml(ex.name)}</span>
          <span class="et-num" style="font-size:12px;color:var(--gym-tx);">${ex.reps || "-"}<span style="font-family:'Pretendard',sans-serif;font-size:9px;color:var(--text-3);">회</span> × ${ex.sets || "-"}<span style="font-family:'Pretendard',sans-serif;font-size:9px;color:var(--text-3);">세트</span></span>
          <button type="button" class="et-btn gym-list-remove" data-idx="${i}" style="background:none;border:none;color:var(--text-3);font-size:15px;padding:0 2px;">×</button>
        </div>`).join("");
      listEl.querySelectorAll(".gym-list-remove").forEach((btn) => {
        btn.addEventListener("click", () => {
          gymQuickList.splice(Number(btn.dataset.idx), 1);
          renderGymList();
        });
      });
    }
    renderGymList();

    document.getElementById("f-gym-quick-add").addEventListener("click", () => {
      const selVal = quickSelect.value;
      const name = selVal === "__custom__" ? quickCustom.value.trim() : selVal;
      if (!name) return; // 종목 안 골랐으면 무시
      const reps = Number(document.getElementById("f-gym-quick-reps").value) || null;
      const sets = Number(document.getElementById("f-gym-quick-sets").value) || null;
      gymQuickList.push({ name, reps, sets });
      renderGymList();
      // 다음 종목 입력을 위해 리셋 (부위 선택은 유지)
      quickSelect.value = "";
      quickCustom.value = "";
      quickCustom.style.display = "none";
      document.getElementById("f-gym-quick-reps").value = "";
      document.getElementById("f-gym-quick-sets").value = "";
      quickSelect.focus();
    });
  }

  const val = (id) => { const el = document.getElementById(id); return el ? el.value : ""; };
  const setVal = (id, v) => { const el = document.getElementById(id); if (el && v != null) el.value = v; };

  function currentDurationSec() {
    const hour = Number(val("f-duration-hour")) || 0;
    const min = Number(val("f-duration-min")) || 0;
    const sec = Number(val("f-duration-sec")) || 0;
    return hour * 3600 + min * 60 + sec;
  }
  function updatePreviews() {
    const totalSec = currentDurationSec();
    const durPreview = document.getElementById("f-duration-preview");
    if (durPreview) durPreview.textContent = totalSec > 0 ? `= ${formatDurationLong(totalSec)}` : "";

    const dist = Number(val("f-distance"));

    const pacePreview = document.getElementById("f-pace-preview");
    if (pacePreview) {
      if (dist > 0 && totalSec > 0) {
        const pace = formatPace(totalSec / dist);
        pacePreview.textContent = pace ? `평균 페이스: ${pace} /km` : "";
      } else {
        pacePreview.textContent = "";
      }
    }

    const speedPreview = document.getElementById("f-speed-preview");
    if (speedPreview) {
      if (dist > 0 && totalSec > 0) {
        const speed = dist / (totalSec / 3600);
        speedPreview.textContent = `평균속도: ${round1(speed)}km/h`;
      } else {
        speedPreview.textContent = "";
      }
    }
  }
  ["f-duration-hour", "f-duration-min", "f-duration-sec", "f-distance"].forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("input", updatePreviews);
  });
  updatePreviews();

  function currentSwimTotalM() {
    let sum = 0;
    document.querySelectorAll(".f-swim-stroke").forEach((el) => { sum += Number(el.value) || 0; });
    return sum;
  }
  function updateSwimTotal() {
    const totalPreview = document.getElementById("f-swim-total-preview");
    if (!totalPreview) return;
    const totalM = currentSwimTotalM();
    totalPreview.textContent = totalM > 0 ? `= 총 ${totalM}m (${round1(totalM / 1000)}km)` : "";
  }
  document.querySelectorAll(".f-swim-stroke").forEach((el) => el.addEventListener("input", updateSwimTotal));
  updateSwimTotal();

  function updateSwimPaceHint() {
    const overrideInput = document.getElementById("f-swim-pace-override");
    if (!overrideInput) return;
    const totalSec = currentDurationSec();
    const totalM = currentSwimTotalM();
    if (totalM > 0 && totalSec > 0) {
      const calc = formatPace(totalSec / (totalM / 100));
      overrideInput.placeholder = calc ? `자동계산: ${calc}` : "2'27\"";
    }
  }
  ["f-duration-min", "f-duration-sec"].forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("input", updateSwimPaceHint);
  });
  document.querySelectorAll(".f-swim-stroke").forEach((el) => el.addEventListener("input", updateSwimPaceHint));
  updateSwimPaceHint();

  const photoBtn = document.getElementById("f-photo-btn");
  const photoInput = document.getElementById("f-photo-input");
  const ocrStatus = document.getElementById("f-ocr-status");
  photoBtn.addEventListener("click", () => photoInput.click());
  photoInput.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const dataUrl = await resizeImageToDataUrl(file);

    // 미리보기는 즉시 로컬 dataUrl로 보여주고, 실제 저장은 업로드 완료된 URL로 교체
    document.getElementById("f-photo-preview").innerHTML = `<img src="${dataUrl}" style="width:42px;height:42px;border-radius:10px;object-fit:cover;opacity:0.6;">`;
    document.getElementById("f-save-draft").style.display = "block";
    if (ocrStatus) ocrStatus.textContent = "스크린샷 업로드 중…";

    try {
      const downloadUrl = await uploadScreenshot(dataUrl);
      pendingScreenshot = downloadUrl;
      document.getElementById("f-photo-preview").innerHTML = `<img src="${downloadUrl}" style="width:42px;height:42px;border-radius:10px;object-fit:cover;">`;
      if (ocrStatus) ocrStatus.textContent = "";
    } catch (err) {
      console.error("스크린샷 업로드 실패", err);
      // 업로드 실패시에도 임시로 dataUrl을 써서 최소한 로컬에서는 보이게 유지
      pendingScreenshot = dataUrl;
      if (ocrStatus) ocrStatus.textContent = "업로드 실패 - 나중에 다시 첨부해줘";
    }

    if (t === "running") {
      if (ocrStatus) ocrStatus.textContent = "자동 인식 중…";
      try {
        const res = await fetch(OCR_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: dataUrl }),
        });
        if (!res.ok) throw new Error("ocr endpoint not available");
        const stats = await res.json();
        if (stats.distance_km != null) setVal("f-distance", stats.distance_km);
        if (stats.duration_sec != null) {
          setVal("f-duration-min", Math.floor(stats.duration_sec / 60));
          setVal("f-duration-sec", stats.duration_sec % 60);
        }
        if (stats.calories != null) setVal("f-calories", stats.calories);
        if (stats.avg_heart_rate != null) setVal("f-hr", stats.avg_heart_rate);
        if (stats.avg_cadence != null) setVal("f-cadence", stats.avg_cadence);
        if (stats.elevation_gain != null) setVal("f-elevation", stats.elevation_gain);
        if (stats.climb_distance_km != null) setVal("f-climb-distance", stats.climb_distance_km);
        if (stats.vo2max != null) setVal("f-vo2max", stats.vo2max);
        updatePreviews();
        if (ocrStatus) ocrStatus.textContent = "자동 입력됨";
      } catch (err) {
        // 백엔드가 아직 없으면 여기로 옴 — 조용히 실패하고 수동 입력으로 넘어감
        if (ocrStatus) ocrStatus.textContent = "자동 인식 불가 (직접 입력)";
      }
    }
  });

  function collect(status) {
    const totalSec = currentDurationSec();

    let dist = val("f-distance") ? Number(val("f-distance")) : null;
    let strokeDistances = null;
    if (t === "swimming") {
      strokeDistances = {};
      let any = false;
      document.querySelectorAll(".f-swim-stroke").forEach((el) => {
        const m = Number(el.value) || 0;
        if (m > 0) { strokeDistances[el.dataset.stroke] = m; any = true; }
      });
      const totalM = currentSwimTotalM();
      dist = totalM > 0 ? totalM / 1000 : null;
      if (!any) strokeDistances = null;
    }

    const pace = (t === "running" && dist > 0 && totalSec > 0) ? formatPace(totalSec / dist) : null;
    const swimPaceOverride = t === "swimming" ? (val("f-swim-pace-override").trim() || null) : null;
    const avgSpeed = (t === "cycling" && dist > 0 && totalSec > 0) ? round1(dist / (totalSec / 3600)) : null;

    let bodyParts = null;
    let exercises = null;
    if (t === "gym") {
      bodyParts = Array.from(document.querySelectorAll('.et-bodypart-chip[data-selected="1"]')).map((c) => c.dataset.part);
      if (bodyParts.length === 0) bodyParts = null;
      exercises = gymQuickList.filter((x) => x.name).map((x) => ({ ...x }));
      if (exercises.length === 0) exercises = null;
    }

    return {
      id: uid(),
      date: modalDate,
      type: t,
      distance: dist,
      strokeDistances,
      durationSec: totalSec > 0 ? totalSec : null,
      pace,
      swimPaceOverride,
      avgSpeed,
      calories: val("f-calories") ? Number(val("f-calories")) : null,
      bodyParts,
      exercises,
      avgHeartRate: val("f-hr") ? Number(val("f-hr")) : null,
      avgCadence: val("f-cadence") ? Number(val("f-cadence")) : null,
      elevationGain: val("f-elevation") ? Number(val("f-elevation")) : null,
      climbDistance: val("f-climb-distance") ? Number(val("f-climb-distance")) : null,
      vo2max: val("f-vo2max") ? Number(val("f-vo2max")) : null,
      temperature: val("f-temp") ? Number(val("f-temp")) : null,
      humidity: val("f-humidity") ? Number(val("f-humidity")) : null,
      weather: document.querySelector('.et-weather-chip[data-selected="1"]')?.dataset.weather || null,
      avgSwolf: val("f-swolf") ? Number(val("f-swolf")) : null,
      shoeId: t === "running" ? (val("f-shoe") || null) : null,
      screenshot: pendingScreenshot,
      status,
    };
  }

  function saveEntry(status) {
    const data = collect(status);
    if (editingEntry) {
      const idx = state.entries.findIndex((e) => e.id === editingEntry.id);
      if (idx !== -1) state.entries[idx] = { ...data, id: editingEntry.id };
    } else {
      state.entries.push(data);
    }
    persist();
    closeModal();
  }

  document.getElementById("f-save").addEventListener("click", () => saveEntry("confirmed"));
  const draftBtn = document.getElementById("f-save-draft");
  if (draftBtn) draftBtn.addEventListener("click", () => saveEntry("draft"));
}

// 페이스(초/km) -> 게이지 레벨 1~7 (7:00~6:40=1 ... 5:00~=7)
function paceToGaugeLevel(paceSec) {
  if (paceSec == null) return 0;
  if (paceSec < 300) return 7;
  if (paceSec < 320) return 6;
  if (paceSec < 340) return 5;
  if (paceSec < 360) return 4;
  if (paceSec < 380) return 3;
  if (paceSec < 400) return 2;
  return 1;
}
const PACE_GAUGE_COLORS = { 1: "#9b59b6", 2: "#2e3192", 3: "#4f8ef7", 4: "#27c96e", 5: "#f0c419", 6: "#f5a623", 7: "#e74c3c" }; // 보남파초노주빨 (느림→빠름)
function renderPaceGauge(paceSec) {
  const filled = paceToGaugeLevel(paceSec);
  const segsHtml = [7, 6, 5, 4, 3, 2, 1].map((lvl) => {
    const lit = paceSec != null && lvl <= filled;
    const c = PACE_GAUGE_COLORS[lvl];
    return `<div style="width:26px;height:4px;border-radius:2px;background:${lit ? c : "var(--surface)"};${lit ? `box-shadow:0 0 5px ${c}99;` : ""}margin-bottom:2px;"></div>`;
  }).join("");
  return `
  <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;">
    <div style="display:flex;flex-direction:column;">${segsHtml}</div>
    <span style="font-size:7.5px;color:var(--text-3);margin-top:4px;white-space:nowrap;text-align:center;line-height:1.2;">${paceSec != null ? `${formatPace(paceSec)}<br>페이스` : "-"}</span>
  </div>`;
}

function shoeManagerHtml() {
  const mileage = shoeMileage();
  const lastWornMap = shoeLastWorn();
  const shoeList = sortShoesByRotation(state.shoes);
  const rows = shoeList.map((s) => ({ shoe: s, stats: shoeRunStats(s.id) }));

  const rowsHtml = rows.map(({ shoe: s, stats }) => {
    const km = mileage[s.id] || 0;
    const pct = Math.min(100, Math.round(km / s.targetKm * 100));
    const lastWorn = lastWornMap[s.id];
    return `
    <div style="padding:10px 12px;border-radius:12px;background:var(--surface-alt);opacity:${s.retired?0.5:1};margin-bottom:8px;">
      <div style="display:flex;align-items:flex-start;gap:10px;">
        <div style="flex:1;min-width:0;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
            <span style="font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(s.name)}</span>
            <button class="et-btn shoe-expand-toggle" data-id="${s.id}" style="background:none;border:none;color:var(--text-3);font-size:13px;padding:2px 4px;flex-shrink:0;">▾</button>
          </div>

          <div style="display:flex;align-items:center;gap:6px;margin-top:6px;">
            <div style="flex:1;height:5px;background:var(--surface);border-radius:3px;overflow:hidden;">
              <div class="et-bar-fill" style="height:100%;width:${pct}%;background:${pct>=90?"var(--danger)":"var(--run)"};border-radius:3px;box-shadow:0 0 6px ${pct>=90?"rgba(231,76,60,.7)":"rgba(39,201,110,.7)"};"></div>
            </div>
            <span style="font-size:9px;color:${pct>=90?"var(--danger)":"var(--text-3)"};white-space:nowrap;">${pct}%</span>
          </div>

          <div style="display:flex;justify-content:space-between;margin-top:5px;">
            <span style="font-size:9px;color:var(--text-3);">${round1(km)}/${s.targetKm}km</span>
            <span style="font-size:9px;color:var(--text-3);">${stats.count}회 · <span style="font-size:11px;color:var(--swim-tx);font-weight:700;">${daysAgoLabel(lastWorn)}</span></span>
          </div>
        </div>
        ${renderPaceGauge(stats.avgPaceSec)}
      </div>
      <div class="shoe-expand-panel" data-id="${s.id}" style="display:none;margin-top:9px;padding-top:9px;border-top:1px solid var(--border);">
        ${s.role ? `<div style="font-size:10px;color:var(--run-tx);margin-bottom:8px;">${escapeHtml(s.role)}</div>` : ""}
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="et-btn et-toggle-retire" data-id="${s.id}" style="font-size:10px;color:var(--text-3);background:none;border:none;">${s.retired?"복원":"은퇴"}</button>
          <button class="et-btn et-edit-name" data-id="${s.id}" style="font-size:10px;color:var(--text-2);background:none;border:none;">이름 수정</button>
          <button class="et-btn et-edit-role" data-id="${s.id}" style="font-size:10px;color:var(--swim-tx);background:none;border:none;">역할 수정</button>
          <button class="et-btn et-edit-initial" data-id="${s.id}" style="font-size:10px;color:var(--text-2);background:none;border:none;">기존거리 수정</button>
          <button class="et-btn et-edit-target" data-id="${s.id}" style="font-size:10px;color:var(--run);background:none;border:none;">최대치 수정</button>
        </div>
      </div>
    </div>`;
  }).join("");

  return `
  ${modalHeaderHtml("러닝화 관리")}
  <div style="margin-bottom:16px;">${rowsHtml}</div>
  <div style="border-top:1px solid var(--border);padding-top:16px;">
    <div style="font-size:12px;color:var(--text-2);margin-bottom:10px;font-weight:600;">새 신발 추가</div>
    <div style="margin-bottom:11px;"><label class="et-field-label">이름</label><input class="et-input" type="text" id="s-name" placeholder="Endorphin Speed 5"></div>
    <div style="margin-bottom:11px;"><label class="et-field-label">역할 (선택)</label><input class="et-input" type="text" id="s-role" placeholder="인터벌, 템포런, 레이스"></div>
    <div style="margin-bottom:11px;"><label class="et-field-label">지금까지 신은 거리 (km)</label><input class="et-input" type="number" step="any" id="s-initial" placeholder="0" value="0"></div>
    <div style="margin-bottom:11px;"><label class="et-field-label">교체 권장 거리 (km)</label><input class="et-input" type="number" step="any" id="s-target" value="600"></div>
    <button id="s-add-btn" class="et-primary-btn">추가</button>
  </div>`;
}
function bindShoeManagerEvents() {
  bindModalClose();
  document.querySelectorAll(".shoe-expand-toggle").forEach((btn) => {
    btn.addEventListener("click", () => {
      const panel = document.querySelector(`.shoe-expand-panel[data-id="${btn.dataset.id}"]`);
      if (!panel) return;
      const open = panel.style.display !== "none";
      panel.style.display = open ? "none" : "block";
      btn.textContent = open ? "▾" : "▴";
    });
  });
  document.querySelectorAll(".et-toggle-retire").forEach((btn) => {
    btn.addEventListener("click", () => {
      const shoe = state.shoes.find((s) => s.id === btn.dataset.id);
      shoe.retired = !shoe.retired;
      persist();
      renderModal();
    });
  });
  document.querySelectorAll(".et-edit-name").forEach((btn) => {
    btn.addEventListener("click", () => {
      const shoe = state.shoes.find((s) => s.id === btn.dataset.id);
      const val = window.prompt("신발 이름을 입력하세요", shoe.name);
      if (val === null) return;
      const trimmed = val.trim();
      if (trimmed) {
        shoe.name = trimmed;
        persist();
        renderModal();
        render();
      }
    });
  });
  document.querySelectorAll(".et-edit-initial").forEach((btn) => {
    btn.addEventListener("click", () => {
      const shoe = state.shoes.find((s) => s.id === btn.dataset.id);
      const val = window.prompt(`${shoe.name} — 이 신발로 이미 뛴 거리(km)를 입력하세요`, shoe.initialKm || 0);
      if (val === null) return;
      const num = Number(val);
      if (!isNaN(num) && num >= 0) {
        shoe.initialKm = num;
        persist();
        renderModal();
        render();
      }
    });
  });
  document.querySelectorAll(".et-edit-target").forEach((btn) => {
    btn.addEventListener("click", () => {
      const shoe = state.shoes.find((s) => s.id === btn.dataset.id);
      const val = window.prompt(`${shoe.name} — 교체 권장 거리(최대치, km)를 입력하세요`, shoe.targetKm || 600);
      if (val === null) return;
      const num = Number(val);
      if (!isNaN(num) && num > 0) {
        shoe.targetKm = num;
        persist();
        renderModal();
        render();
      }
    });
  });
  document.querySelectorAll(".et-edit-role").forEach((btn) => {
    btn.addEventListener("click", () => {
      const shoe = state.shoes.find((s) => s.id === btn.dataset.id);
      const val = window.prompt(`${shoe.name} — 이 신발의 역할을 입력하세요 (예: 인터벌, 템포런, 레이스)`, shoe.role || "");
      if (val === null) return;
      shoe.role = val.trim();
      persist();
      renderModal();
      render();
    });
  });
  document.getElementById("s-add-btn").addEventListener("click", () => {
    const name = document.getElementById("s-name").value.trim();
    const role = document.getElementById("s-role").value.trim();
    const target = Number(document.getElementById("s-target").value) || 600;
    const initial = Number(document.getElementById("s-initial").value) || 0;
    if (!name) return;
    state.shoes.push({ id: uid(), name, role, targetKm: target, initialKm: initial, retired: false });
    persist();
    renderModal();
    render();
  });
}

/* ===========================================================
   시작
=========================================================== */
render(); // 로딩 표시 먼저
(async () => {
  state = await loadData();
  loaded = true;
  render();
})();

</script>
